name: LocalFilter
options:
  bundleIdPrefix: com.axelkirk.localfilter
  deploymentTarget:
    iOS: '17.0'
packages:
  LocalFilterCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LocalFilter:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LocalFilterCore
        product: LocalFilterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axelkirk.localfilter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LocalFilter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
schemes:
  LocalFilter:
    build:
      targets:
        LocalFilter: all
