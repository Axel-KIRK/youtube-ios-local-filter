name: LocalFilter
options:
  bundleIdPrefix: com.axelkirk.localfilter
  deploymentTarget:
    iOS: '17.0'
packages:
  LocalFilterCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LocalFilter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: LocalFilterCore
        product: LocalFilterCore
      - target: LocalFilterTunnel
        embed: true
    entitlements:
      path: App/LocalFilter.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axelkirk.localfilter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LocalFilter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
  LocalFilterTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    dependencies:
      - package: LocalFilterCore
        product: LocalFilterTransport
    entitlements:
      path: Tunnel/LocalFilterTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: LocalFilter Connection
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axelkirk.localfilter.Tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  LocalFilter:
    build:
      targets:
        LocalFilter: all
